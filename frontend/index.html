<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback | IntelliFeedback</title>
    <meta name="description" content="Submit your feedback to help us improve.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>IntelliFeedback</h1>
        <nav>
            <a href="index.html" class="active">Submit Feedback</a>
            <a href="dashboard.html">Analytics Dashboard</a>
        </nav>
    </header>

    <main class="container fade-in">
        <div class="glass-card">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">We Value Your Feedback</h2>
            <form id="feedbackForm">
                <div class="form-group">
                    <label for="customer_name">Your Name</label>
                    <input type="text" id="customer_name" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label>How would you rate your experience?</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required />
                        <label for="star5" title="5 stars">★</label>
                        <input type="radio" id="star4" name="rating" value="4" />
                        <label for="star4" title="4 stars">★</label>
                        <input type="radio" id="star3" name="rating" value="3" />
                        <label for="star3" title="3 stars">★</label>
                        <input type="radio" id="star2" name="rating" value="2" />
                        <label for="star2" title="2 stars">★</label>
                        <input type="radio" id="star1" name="rating" value="1" />
                        <label for="star1" title="1 star">★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="feedback_text">Detailed Feedback</label>
                    <textarea id="feedback_text" rows="5" placeholder="Tell us what you liked or what we can improve..." required></textarea>
                </div>

                <button type="submit" class="btn" id="submitBtn">Submit Feedback</button>
            </form>
        </div>
    </main>

    <div id="notification"></div>

    <script src="app.js"></script>
</body>
</html>
